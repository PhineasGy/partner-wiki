<h2>徽章</h2>
<p>打贏一間道館，會拿到該館屬性的徽章。同一屬性可以拿多次，聊天會顯示次數。</p>
<p><span class="cmd">!徽章</span> 列出你贏過哪些屬性。</p>
<p>徽章是收集用，<strong>不影響</strong>對戰或道館的傷害計算。</p>
<h3>打 !炫耀徽章 會長這樣</h3>
<p>直播畫面會出現徽章盒。有贏過的屬性會亮在對應的洞，下面的數字是次數。沒贏過的洞是空的。</p>
<figure class="demo"><img src="images/guide/showcase-badges.png" alt="示意：炫耀徽章盒子（這張是示範用的次數，不是你的紀錄）。"><figcaption>示意：炫耀徽章盒子（這張是示範用的次數，不是你的紀錄）。</figcaption></figure>
<p>18 種屬性都有對應的館：</p>
